[workspace]
resolver = "2"
members = [
    "crates/freebsd-timeline-core",
    "crates/freebsd-timelined",
    "crates/freebsd-timeline-cli",
    "crates/freebsd-timeline-gtk",
]
# The GUI needs GTK4 + libadwaita system libraries, so a plain `cargo build`
# only builds the parts that work everywhere. Build the GUI with
# `cargo build -p freebsd-timeline-gtk`.
default-members = [
    "crates/freebsd-timeline-core",
    "crates/freebsd-timelined",
    "crates/freebsd-timeline-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/Dishwasher-DEV/freebsd-timeline"
rust-version = "1.75"

[workspace.dependencies]
freebsd-timeline-core = { path = "crates/freebsd-timeline-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
